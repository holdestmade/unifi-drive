name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # "brands" requires the domain to be merged into
          # home-assistant/brands, which is only needed for inclusion in the
          # HACS default store.
          ignore: brands

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # hassfest expects the custom_components/<domain> layout, while this
      # repository keeps the integration in the root (hacs.json
      # content_in_root). Rearrange the checkout to match.
      - name: Arrange custom_components layout
        run: |
          mkdir -p custom_components/unifi_drive
          find . -maxdepth 1 -mindepth 1 \
            ! -name custom_components ! -name .git ! -name .github \
            -exec mv {} custom_components/unifi_drive/ \;

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
